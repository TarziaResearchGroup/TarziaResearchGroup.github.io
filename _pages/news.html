---
layout: archive
permalink: /news-archive/
title: "News"
author_profile: true
redirect_from:
  - /news/
---

{% include base_path %}

<h2>News</h2>
<br>

{% for work in site.data.news %}
  <div id="container">
    <div id="left">
        <b>{ work.title }</b> ({{ work.date }})<br>
        <i>{{ work.journal }}</i>, <b>{{work.volume}}</b>, {{work.pages}},  <a href="{{ work.url }}">DOI</a>. 
        <br>
    </div>
    <div class="clear"></div>
  </div>
  <hr>
{% endfor %}
